# Cloudflare Workers configuration for the SAM MCP connector.
# Secrets (MCP_AUTH_SECRET and, per account N, SAM_ACCOUNT_<N>_EMAIL / _PASSWORD /
# _CONNECTOR_PASSWORD / _STATIC_TOKEN) are NOT stored here: set them with
# `npx wrangler secret put <NAME>` (see README.md).
name = "sam-mcp"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
SAM_API_BASE_URL = "https://eicajdaswdgfwgmaxene.supabase.co/functions/v1"
# disabled | confirm | direct  (confirm = preview + explicit confirmation before any write)
# "direct" (requested by the owner on 2026-10-26 for speed): creates, updates and deletes are applied
# immediately, without preview/confirmation token. Set "confirm" to bring back the two-step confirmation.
SAM_WRITE_MODE = "direct"
# Email sending through SAM (send_email, send_template_email). Enabled 2026-10-27 (owner: tests in production).
SAM_SEND_EMAIL = "true"
LOG_LEVEL = "info"
# Optional: set once the final URL is known (custom domain), otherwise derived from the request.
MCP_PUBLIC_URL = "https://sam-mcp.sam-crm.workers.dev"
# OAUTH_ALLOWED_REDIRECT_HOSTS = "claude.ai,claude.com,localhost,127.0.0.1"
